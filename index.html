<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OOO - Opening Environment</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: radial-gradient(ellipse at center, #1a0033 0%, #000011 70%);
            font-family: Arial, sans-serif; 
        }
        #loading {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,20,0.9); color: white; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 1000; transition: opacity 0.6s;
        }
        #loading-bar { width: 0%; height: 4px; background: linear-gradient(90deg, #ffaa88, #88aaff); margin-top: 20px; }
        #loading-text { font-size: 18px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div id="loading">
        <div id="loading-text">Initializing dream...</div>
        <div id="loading-bar"></div>
    </div>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.167.1/build/three.module.js?module",
                "three/addons/": "https://unpkg.com/three@0.167.1/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="./main.js"></script>
</body>
</html>
